  <title>Logitech en Tecnistore | Periféricos oficiales en Bogotá</title>
  <meta name="description" content="Compra periféricos Logitech originales en Tecnistore. Mice, teclados, webcams, diademas y más para hogar, gaming y oficina. Garantía de fábrica.">

  <style>
    /* ── Hero Logitech ── */
    .lg-hero {
      position: relative;
      height: 420px;
      background: #000 url('/images/slides/camara-logitech.png') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .lg-hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.68);
    }
    .lg-hero-content {
      position: relative;
      z-index: 1;
      color: #fff;
    }
    .lg-hero-logo {
      width: 200px;
      margin-bottom: 18px;
      filter: brightness(0) invert(1);
    }
    .lg-hero-tagline {
      font-size: 1.05rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      opacity: 0.85;
    }

    /* ── Tabs ── */
    .lg-tabs-wrap {
      background: #f5f5f5;
      border-bottom: 2px solid #e0e0e0;
    }
    .lg-tabs {
      display: flex;
      justify-content: center;
      gap: 0;
      max-width: 600px;
      margin: 0 auto;
    }
    .lg-tab {
      flex: 1;
      padding: 18px 28px;
      font-family: 'Lato', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: none;
      background: #f5f5f5;
      color: #555;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .lg-tab:hover { color: #000; }
    .lg-tab.active {
      background: #000;
      color: #fff;
      border-bottom-color: #00b0f0;
    }

    /* ── Panels ── */
    .lg-panel {
      display: none;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .lg-panel.active {
      display: block;
    }
    .lg-panel.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Sección de panel ── */
    .lg-section {
      padding: 48px 0 56px;
    }
    .lg-section-title {
      font-size: 1.55rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 32px;
      color: #111;
    }
    .lg-section-title span {
      color: #00b0f0;
    }

    /* ── Grid de productos ── */
    .lg-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    @media (max-width: 1024px) { .lg-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px)  { .lg-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px)  { .lg-grid { grid-template-columns: 1fr; } }

    /* ── Card de producto ── */
    .lg-card {
      background: #fff;
      border: 1.5px solid #e8e8e8;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow 0.22s, border-color 0.22s, transform 0.22s;
    }
    .lg-card:hover {
      box-shadow: 0 6px 24px rgba(0,176,240,0.18);
      border-color: #00b0f0;
      transform: translateY(-3px);
    }
    .lg-card-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      padding: 18px;
      background: #fafafa;
    }
    .lg-card-body {
      padding: 14px 16px 18px;
    }
    .lg-card-name {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #111;
      margin-bottom: 8px;
      line-height: 1.35;
    }
    .lg-card-price {
      font-size: 1.05rem;
      font-weight: 900;
      color: #0057b8;
    }
    .lg-card-old {
      font-size: 0.78rem;
      color: #999;
      text-decoration: line-through;
      margin-left: 6px;
    }
    .lg-card-badge {
      display: inline-block;
      background: #00b0f0;
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 3px;
      margin-top: 6px;
    }

    /* ── Modal ── */
    .lg-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lg-modal-overlay.open { display: flex; }
    .lg-modal {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      max-width: 560px;
      width: 95%;
      max-height: 90vh;
      overflow-y: auto;
      animation: lgModalIn 0.22s ease;
    }
    @keyframes lgModalIn {
      from { opacity: 0; transform: scale(0.93); }
      to   { opacity: 1; transform: scale(1); }
    }
    .lg-modal-header {
      background: #000;
      color: #fff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .lg-modal-header h3 {
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 0;
    }
    .lg-modal-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
    }
    .lg-modal-img {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      padding: 24px;
      background: #f7f7f7;
    }
    .lg-modal-body {
      padding: 20px 24px 28px;
    }
    .lg-modal-name {
      font-size: 1.1rem;
      font-weight: 900;
      text-transform: uppercase;
      color: #111;
      margin-bottom: 10px;
    }
    .lg-modal-price {
      font-size: 1.5rem;
      font-weight: 900;
      color: #0057b8;
      margin-bottom: 4px;
    }
    .lg-modal-old {
      font-size: 0.85rem;
      color: #999;
      text-decoration: line-through;
      margin-bottom: 6px;
    }
    .lg-modal-badge {
      display: inline-block;
      background: #00b0f0;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    .lg-modal-wa {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      background: #25D366;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: 'Lato', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .lg-modal-wa:hover { background: #1da851; }
    .lg-modal-wa svg { flex-shrink: 0; }
  </style>
</head>

    function fmt(n) {
      return '$' + n.toLocaleString('es-CO');
    }

    function buildGrid(cat) {
      const grid = document.getElementById('grid-' + cat);
      if (!grid || grid.children.length > 0) return;
      PRODUCTOS[cat].forEach(p => {
        const card = document.createElement('div');
        card.className = 'lg-card';

        const img = document.createElement('img');
        img.className = 'lg-card-img';
        img.src = p.img;
        img.alt = p.name;
        img.loading = 'lazy';

        const name = document.createElement('div');
        name.className = 'lg-card-name';
        name.textContent = p.name;

        const priceWrap = document.createElement('div');
        const priceEl = document.createElement('span');
        priceEl.className = 'lg-card-price';
        priceEl.textContent = fmt(p.price);
        const oldEl = document.createElement('span');
        oldEl.className = 'lg-card-old';
        oldEl.textContent = fmt(p.oldPrice);
        priceWrap.appendChild(priceEl);
        priceWrap.appendChild(oldEl);

        const badge = document.createElement('span');
        badge.className = 'lg-card-badge';
        badge.textContent = p.discount;

        const body = document.createElement('div');
        body.className = 'lg-card-body';
        body.appendChild(name);
        body.appendChild(priceWrap);
        body.appendChild(badge);

        card.appendChild(img);
        card.appendChild(body);

        card.addEventListener('click', () => openModal(p));
        grid.appendChild(card);
      });
    }

    /* ── Tabs ── */
    function switchTab(cat) {
      document.querySelectorAll('.lg-tab').forEach(t => {
        t.classList.remove('active');
        t.setAttribute('aria-selected', 'false');
      });
      document.querySelectorAll('.lg-panel').forEach(p => {
        p.classList.remove('active', 'visible');
      });

      const tab   = document.getElementById('tab-' + cat);
      const panel = document.getElementById('panel-' + cat);
      tab.classList.add('active');
      tab.setAttribute('aria-selected', 'true');
      panel.classList.add('active');
      buildGrid(cat);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => panel.classList.add('visible'));
      });
    }

    /* ── Modal ── */
    function openModal(p) {
      document.getElementById('modal-product-name').textContent = p.name;
      document.getElementById('modal-img').src = p.img;
      document.getElementById('modal-img').alt = p.name;
      document.getElementById('modal-price').textContent = fmt(p.price);
      document.getElementById('modal-old').textContent = fmt(p.oldPrice);
      document.getElementById('modal-badge').textContent = p.discount;
      const msg = encodeURIComponent('Hola, me interesa el ' + p.name + ' a ' + fmt(p.price) + '. ¿Está disponible?');
      document.getElementById('modal-wa-btn').href = 'https://wa.me/573017298980?text=' + msg;
      document.getElementById('lg-modal-overlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('lg-modal-overlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('lg-modal-overlay')) closeModal();
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    /* ── Nav hamburger ── */
    function closeMobileMenu() {
      const menu = document.getElementById('nav-mobile-menu');
      const btn  = document.getElementById('nav-hamburger');
      if (menu) { menu.style.display = 'none'; menu.setAttribute('aria-hidden', 'true'); }
      if (btn)  { btn.setAttribute('aria-expanded', 'false'); }
    }
    const hamburger = document.getElementById('nav-hamburger');
    if (hamburger) {
      hamburger.addEventListener('click', () => {
        const menu = document.getElementById('nav-mobile-menu');
        const open = hamburger.getAttribute('aria-expanded') === 'true';
        hamburger.setAttribute('aria-expanded', String(!open));
        menu.setAttribute('aria-hidden', String(open));
        menu.style.display = open ? 'none' : 'flex';
      });
    }

    /* ── Inicializar primera tab ── */
    buildGrid('hogar');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => document.getElementById('panel-hogar').classList.add('visible'));
    });
  </script>
